# One-off check: which route lets a GitHub runner open, record and read the chat of a YouTube live stream?
# Same toolkit as the ClipperyAI website worker: Node (yt-dlp's JS challenge solver), a free Cloudflare WARP
# tunnel (wgcf + wireproxy as a local SOCKS proxy), the bgutil PO-token helper, and optional cookies
# (repo secret YTDLP_COOKIES_B64). Nothing is uploaded; it prints a report (also in the run summary).
name: youtube-test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube live URL (a channel's /live page or a watch link)"
        required: true
        default: "https://www.youtube.com/@LofiGirl/live"
      watcher_minutes:
        description: "0 = route probe only; N = also run the real watcher for N minutes on `channel`"
        required: false
        default: "0"
      channel:
        description: "channel for the watcher run (@handle, UC id or v=VIDEOID)"
        required: false
        default: "@LofiGirl"

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'SMaarij/clippery_live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: ${{ inputs.url }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]" streamlink "requests[socks]"
      - name: Cloudflare WARP tunnel (new address until YouTube accepts one)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/warp_until_ok.sh "$URL" 8
      - name: PO-token helper
        continue-on-error: true
        run: |
          docker run -d --name bgutil --init --net=host ${WARP_SOCKS:+-e HTTPS_PROXY=$WARP_SOCKS -e ALL_PROXY=$WARP_SOCKS} brainicism/bgutil-ytdlp-pot-provider >/dev/null
          pip install -q bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4416/ping >/dev/null && break; sleep 2; done
          if curl -s -m 60 -X POST http://127.0.0.1:4416/get_pot -H 'Content-Type: application/json' -d '{}' | grep -qi 'potoken\|po_token'; then
            echo "POT_MINT=ok" >> "$GITHUB_ENV"; echo "mint ok"
          else
            pip uninstall -y -q bgutil-ytdlp-pot-provider; echo "POT_MINT=failed" >> "$GITHUB_ENV"; echo "mint failed"
          fi
      - name: Probe
        if: inputs.watcher_minutes == '0'
        run: python tests/yt_probe.py "$URL"
      - name: Real watcher, local mode (no database), a few minutes
        if: inputs.watcher_minutes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install -q -r requirements.txt
          pkill -f "wireproxy -c wireproxy.conf" || true; unset WARP_SOCKS     # the watcher brings up its own tunnel
          CH="${{ inputs.channel }}"
          echo "::add-mask::$CH"
          timeout $(( ${{ inputs.watcher_minutes }} * 60 + 240 )) python -m live.watcher --platform youtube --channel "$CH" \
            --local out --max-hours $(python -c "print(${{ inputs.watcher_minutes }}/60)") \
            --settings '{"sensitivity":"high","wait_minutes":3}' || true
          echo "--- result"
          ls out 2>/dev/null | head; python -c "import json,os;p='out/clips.json';c=json.load(open(p)) if os.path.exists(p) else [];print(len(c),'clips',[{k:x.get(k) for k in ('duration','title','hook')} for x in c][:3])"
