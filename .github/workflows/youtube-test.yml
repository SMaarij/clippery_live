# One-off check: which route lets a GitHub runner open, record and read the chat of a YouTube live stream?
# Same toolkit as the ClipperyAI website worker: Node (yt-dlp's JS challenge solver), a free Cloudflare WARP
# tunnel (wgcf + wireproxy as a local SOCKS proxy), the bgutil PO-token helper, and optional cookies
# (repo secret YTDLP_COOKIES_B64). Nothing is uploaded; it prints a report (also in the run summary).
name: youtube-test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube live URL (a channel's /live page or a watch link)"
        required: true
        default: "https://www.youtube.com/@LofiGirl/live"

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'SMaarij/clippery_live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: ${{ inputs.url }}
      YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]" chat-downloader "requests[socks]"
      - name: Cloudflare WARP tunnel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          asset() { curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | grep browser_download_url | grep "$2" | head -1 | cut -d '"' -f4; }
          curl -sSL "$(asset ViRb3/wgcf linux_amd64)" -o wgcf && chmod +x wgcf
          ./wgcf register --accept-tos >/dev/null && ./wgcf generate >/dev/null
          curl -sSL "$(asset windtf/wireproxy linux_amd64.tar.gz)" | tar xz wireproxy
          cp wgcf-profile.conf wireproxy.conf
          printf '\n[Socks5]\nBindAddress = 127.0.0.1:1080\n' >> wireproxy.conf
          nohup ./wireproxy -c wireproxy.conf > wireproxy.log 2>&1 &
          sleep 4
          curl -s --max-time 15 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(colo|warp)='
          echo "WARP_SOCKS=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"
      - name: PO-token helper
        continue-on-error: true
        run: |
          docker run -d --name bgutil --init --net=host ${WARP_SOCKS:+-e HTTPS_PROXY=$WARP_SOCKS -e ALL_PROXY=$WARP_SOCKS} brainicism/bgutil-ytdlp-pot-provider >/dev/null
          pip install -q bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4416/ping >/dev/null && break; sleep 2; done
          if curl -s -m 60 -X POST http://127.0.0.1:4416/get_pot -H 'Content-Type: application/json' -d '{}' | grep -qi 'potoken\|po_token'; then
            echo "POT_MINT=ok" >> "$GITHUB_ENV"; echo "mint ok"
          else
            pip uninstall -y -q bgutil-ytdlp-pot-provider; echo "POT_MINT=failed" >> "$GITHUB_ENV"; echo "mint failed"
          fi
      - name: Probe
        run: python tests/yt_probe.py "$URL"
