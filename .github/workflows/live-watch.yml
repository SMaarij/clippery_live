# Live watcher: started from the ClipperyAI admin panel ("Live" page), never on a schedule.
#
#  * follows one Twitch or YouTube channel: records it into a rolling buffer, reads chat, and cuts a vertical, captioned clip
#    whenever chat spikes; clips go to R2 and the live_clips table, where the admin panel lists them
#  * one run lasts up to ~5.4 h; longer streams are handed to a fresh run of this workflow with no gap
#  * stops when you press Stop, when the stream ends, or at the watch's hour limit
#
# This repo is public: its Actions minutes are free, and its logs are public. Secrets are never printed, and the
# channel name is masked in the logs.
#
# YouTube refuses GitHub's addresses, so for YouTube watches the watcher brings up a free Cloudflare WARP tunnel
# (scripts/warp_until_ok.sh), taking a fresh address until YouTube accepts one, and again if it is blocked mid-stream.
#
# Repo secrets: SUPABASE_URL, SUPABASE_SECRET_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET_UPLOADS, GROQ_API_KEY (captions); optional TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET (viewer clips).
name: live-watch

on:
  workflow_dispatch:
    inputs:
      watch_id:
        description: "live_watches id (created by the admin panel)"
        required: true

permissions:
  contents: read
  actions: write          # lets a run start the next run for long streams

jobs:
  watch:
    if: github.repository == 'SMaarij/clippery_live'      # forks never run it
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LIVE_RETENTION_HOURS: ${{ vars.LIVE_RETENTION_HOURS || '3' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_UPLOADS: ${{ secrets.R2_BUCKET_UPLOADS }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # the WARP script looks up its downloads with it
      LIVE_WORKFLOW_FILE: live-watch.yml
      WHISPER_MODEL: base
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # yt-dlp needs a JS runtime for YouTube
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Watch
        run: python -m live.watcher --watch "${{ inputs.watch_id }}"
